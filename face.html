<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>スマッホチャン</title>
<style>
  html, body { margin:0; height:100%; background:#111; overflow:hidden;
    font-family: sans-serif; -webkit-user-select:none; user-select:none; }
  #face { position:relative; width:100%; height:100%; }
  .eye { position:absolute; top:38%; width:11%; height:16%;
    background:#f5f5f5; border-radius:50%; transition: all .15s; }
  #eyeL { left:28%; } #eyeR { right:28%; }
  .eye.happy { height:5%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .eye.sleep { height:2%; }
  .eye.blink { height:2%; }
  #mouth { position:absolute; left:50%; top:66%; width:26%; height:3.5%;
    transform:translateX(-50%); background:#f5f5f5; border-radius:999px;
    transition: all .15s; }
  #mouth.talk { height:9%; border-radius:50%; }
  #mouth.happy { height:10%; border-radius: 0 0 999px 999px; }
  #bar { position:absolute; left:0; right:0; bottom:0; padding:10px;
    display:flex; gap:8px; justify-content:center; align-items:center; }
  button { font-size:15px; padding:10px 14px; border-radius:10px; border:0;
    background:#2b2b2b; color:#eee; }
  #status { color:#888; font-size:12px; }
</style>
</head>
<body>
<div id="face">
  <div class="eye" id="eyeL"></div>
  <div class="eye" id="eyeR"></div>
  <div id="mouth"></div>
  <div id="bar">
    <button id="bleBtn">首とつなぐ (BLE)</button>
    <span id="status">未接続</span>
  </div>
</div>
<script>
"use strict";
// 首 (ATOM Lite / micro:bit 共通) BLE UART (Nordic UART Service)
const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // 端末 -> 首
let rxChar = null;
const statusEl = document.getElementById("status");
const eyeL = document.getElementById("eyeL");
const eyeR = document.getElementById("eyeR");
const mouth = document.getElementById("mouth");

async function sendNeck(cmd) {
  if (!rxChar) return;
  try {
    const data = new TextEncoder().encode(cmd + "\n");
    // BLEの1回書き込みは20バイトまで。コマンドは短い前提
    await rxChar.writeValue(data);
  } catch (e) { statusEl.textContent = "送信失敗: " + e.message; }
}

document.getElementById("bleBtn").addEventListener("click", async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [UART_SERVICE] }],
    });
    device.addEventListener("gattserverdisconnected", () => {
      rxChar = null;
      statusEl.textContent = "切断された（もう一度ボタンで接続）";
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    rxChar = await service.getCharacteristic(UART_RX);
    statusEl.textContent = "首と接続中: " + (device.name || "");
    sendNeck("CENTER");
  } catch (e) {
    statusEl.textContent = "接続失敗: " + e.message;
  }
});

// 顔の状態を変える: normal | happy | sleep | talk
function setFace(state) {
  for (const el of [eyeL, eyeR]) el.className = "eye" + (state === "happy" ? " happy" : state === "sleep" ? " sleep" : "");
  mouth.className = state === "talk" ? "talk" : state === "happy" ? "happy" : "";
  mouth.id = "mouth";
}

// まばたき
setInterval(() => {
  if (eyeL.classList.contains("happy") || eyeL.classList.contains("sleep")) return;
  eyeL.classList.add("blink"); eyeR.classList.add("blink");
  setTimeout(() => { eyeL.classList.remove("blink"); eyeR.classList.remove("blink"); }, 140);
}, 3400);

// agent.py からの意図を受け取る: {"cmd":"NOD"} / {"cmd":"FACE:happy"} など
async function pollIntent() {
  try {
    const res = await fetch("/intent", { cache: "no-store" });
    const data = await res.json();
    if (data && data.cmd) {
      if (data.cmd.startsWith("FACE:")) setFace(data.cmd.slice(5));
      else sendNeck(data.cmd);
    }
  } catch (e) { /* agent未起動時は無視 */ }
}
setInterval(pollIntent, 600);

// 画面タップでも試せるように: 左/右/真ん中で向きを変える
document.getElementById("face").addEventListener("click", (ev) => {
  if (ev.target.tagName === "BUTTON") return;
  const x = ev.clientX / window.innerWidth;
  if (x < 0.35) sendNeck("PAN 55");
  else if (x > 0.65) sendNeck("PAN 125");
  else sendNeck("NOD");
});
</script>
</body>
</html>
