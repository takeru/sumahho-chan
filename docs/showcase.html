<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマッホチャン｜部品・組み立て・動作シミュレーション</title>
<style>
  body { margin:0; font-family:sans-serif; background:#f4f4f2; color:#22303c; }
  header { padding:14px 16px 0; }
  header h1 { font-size:19px; margin:0 0 4px; }
  header p { font-size:13px; color:#667; margin:0 0 10px; line-height:1.6; }
  .tabs { display:flex; gap:6px; padding:0 16px; flex-wrap:wrap; }
  .tabs button { font-size:14px; padding:8px 14px; border:0; border-radius:999px;
    background:#dfe5e9; color:#22303c; cursor:pointer; }
  .tabs button.on { background:#2b3a46; color:#fff; }
  #stage { display:flex; flex-wrap:wrap; }
  #view { flex:1 1 420px; min-height:68vh; position:relative; }
  #cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .panel { flex:0 1 320px; padding:14px; box-sizing:border-box; }
  .panel h2 { font-size:15px; margin:4px 0 10px; }
  .row { margin:10px 0; }
  label { font-size:13px; display:flex; justify-content:space-between; }
  input[type=range] { width:100%; }
  button.act { font-size:13px; padding:7px 10px; margin:2px; border:0; border-radius:8px;
    background:#2b3a46; color:#fff; cursor:pointer; }
  button.sub { background:#7a8794; }
  #readout, #stepCap { font-size:13px; line-height:1.7; background:#fff; border-radius:10px;
    padding:10px 12px; margin-top:10px; }
  .ok { color:#1d7a3a; } .warn { color:#c0392b; }
  .note { font-size:12px; color:#667; margin-top:10px; line-height:1.6; }
  #partsGrid { display:none; padding:16px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .card { background:#fff; border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .card canvas { width:100%; height:150px; display:block; background:#f8f8f6; border-radius:8px; }
  .card .spec { font-size:12px; line-height:1.7; color:#445; margin-top:8px; }
  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px;
    background:#e8eef2; color:#345; margin-left:6px; vertical-align:1px; }
  .tag.buy { background:#fdf0d5; }
</style>
</head>
<body>
<header>
  <h1>スマッホチャン｜部品・組み立て・動作シミュレーション</h1>
  <p>作った部品（CAD の実寸）そのままで動かせるページ。部品の一覧、組み立ての手順、首の動作を1つにまとめた。外部ライブラリなしの単体動作。</p>
</header>
<div class="tabs">
  <button id="tabParts">パーツ一覧</button>
  <button id="tabAsm" class="on">組み立て</button>
  <button id="tabMotion">動作</button>
</div>

<div id="partsGrid"></div>

<div id="stage">
  <div id="view"><canvas id="cv"></canvas></div>

  <div class="panel" id="asmPanel">
    <h2>組み立てシミュレーション</h2>
    <div class="row">
      <label>進行度 <span id="asmVal">ステップ 1 / 6</span></label>
      <input type="range" id="asmRange" min="0" max="6" value="0" step="0.01">
    </div>
    <div class="row">
      <button class="act sub" id="asmPrev">← 前へ</button>
      <button class="act" id="asmNext">次へ →</button>
      <button class="act sub" id="asmPlay">▶ 自動再生</button>
    </div>
    <div id="stepCap"></div>
    <div class="note">スライダーを途中まで動かすと、その部品が半分だけ入った状態も見られる。ドラッグで回転、ホイールでズーム。土台シェルは中が見えるよう半透明にしてある。</div>
  </div>

  <div class="panel" id="motionPanel" style="display:none">
    <h2>動作シミュレーション（首）</h2>
    <div class="row">
      <label>パン（左右）<span id="panVal">0°</span></label>
      <input type="range" id="pan" min="-80" max="80" value="0" step="1">
    </div>
    <div class="row">
      <label>チルト（上下）<span id="tiltVal">0°</span></label>
      <input type="range" id="tilt" min="-45" max="45" value="0" step="1">
    </div>
    <div class="row">
      <button class="act" id="btnCenter">CENTER</button>
      <button class="act" id="btnNod">NOD</button>
      <button class="act" id="btnShake">SHAKE</button>
      <button class="act sub" id="btnSway">ゆらぎ ON/OFF</button>
    </div>
    <div id="readout">読み込み中…</div>
    <div class="note">角度はファームと同じ「少しずつ寄せる」動きで再現。寸法は MECHANISM.md と CAD の実寸ベース。</div>
  </div>
</div>

<script>
"use strict";
// ---- 簡易3D (Canvas 2D, 外部依存なし) ----
const LIGHT = (() => { const v = [0.45, 0.8, 0.5]; const l = Math.hypot(...v); return v.map(x => x / l); })();
function rotY(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }
function rotX(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; }

// 形状ビルダ: 対象配列に {faces, color} を追加する
function boxInto(arr, cx, cy, cz, w, h, d, color) {
  const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2, z0 = cz - d / 2, z1 = cz + d / 2;
  arr.push({ color, faces: [
    [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]],
    [[x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [x0, y0, z0]],
    [[x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0]],
    [[x0, y0, z1], [x0, y0, z0], [x1, y0, z0], [x1, y0, z1]],
    [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]],
    [[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]],
  ]});
}
function cylInto(arr, cx, cy, cz, r, h, color, seg = 28) {
  const top = [], bot = [], faces = [];
  for (let i = 0; i < seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    top.push([cx + r * Math.cos(a), cy + h / 2, cz + r * Math.sin(a)]);
    bot.push([cx + r * Math.cos(a), cy - h / 2, cz + r * Math.sin(a)]);
  }
  for (let i = 0; i < seg; i++) { const j = (i + 1) % seg; faces.push([bot[i], bot[j], top[j], top[i]]); }
  faces.push(top.slice().reverse()); faces.push(bot);
  arr.push({ color, faces });
}
function cylXInto(arr, cx, cy, cz, r, h, color, seg = 24) {
  const lft = [], rgt = [], faces = [];
  for (let i = 0; i < seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    lft.push([cx - h / 2, cy + r * Math.cos(a), cz + r * Math.sin(a)]);
    rgt.push([cx + h / 2, cy + r * Math.cos(a), cz + r * Math.sin(a)]);
  }
  for (let i = 0; i < seg; i++) { const j = (i + 1) % seg; faces.push([lft[i], lft[j], rgt[j], rgt[i]]); }
  faces.push(lft, lft.slice().reverse(), rgt, rgt.slice().reverse());
  arr.push({ color, faces });
}
function faceNormal(pts) {
  const [a, b, c] = pts;
  const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const v = [c[0] - b[0], c[1] - b[1], c[2] - b[2]];
  const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
  const l = Math.hypot(...n) || 1;
  return n.map(x => x / l);
}
// 汎用描画: items = [{faces, color, alpha}], tf = 点変換, view = {az, el, zoom, cx, cy}
function renderScene(ctx, w, h, items, tf, view, ground) {
  const proj = (p) => {
    let q = rotY(tf(p), view.az);
    q = rotX(q, view.el);
    return [view.cx + q[0] * view.zoom, view.cy - q[1] * view.zoom, q[2]];
  };
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#f4f4f2"; ctx.fillRect(0, 0, w, h);
  if (ground) {
    ctx.strokeStyle = "#dddddd"; ctx.lineWidth = 1; ctx.beginPath();
    for (let g = -140; g <= 140; g += 20) {
      let a = proj([g, 0, -140]), b = proj([g, 0, 140]);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      a = proj([-140, 0, g]); b = proj([140, 0, g]);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    }
    ctx.stroke();
  }
  const list = [];
  for (const it of items) {
    for (const face of it.faces) {
      const world = face.map(p => tf(p));
      let vw = world.map(p => { let q = rotY(p, view.az); return rotX(q, view.el); });
      const n = faceNormal(vw);
      if (n[2] < -0.02) continue;
      const depth = vw.reduce((s, p) => s + p[2], 0) / vw.length;
      const wl = faceNormal(world);
      const shade = 0.45 + 0.55 * Math.max(0, wl[0] * LIGHT[0] + wl[1] * LIGHT[1] + wl[2] * LIGHT[2]);
      list.push({ world, depth, color: it.color, shade, alpha: it.alpha == null ? 1 : it.alpha });
    }
  }
  list.sort((a, b) => a.depth - b.depth);
  for (const item of list) {
    const pts = item.world.map(p => proj(p));
    const [r, g, b] = item.color.map(c => Math.min(255, Math.round(c * item.shade + 12)));
    ctx.fillStyle = `rgba(${r},${g},${b},${item.alpha})`;
    ctx.strokeStyle = "rgba(60,70,80,0.35)";
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  return proj;
}

// ---- 色 ----
const C_BASE = [223, 227, 230], C_DARK = [154, 164, 171], C_STACK = [240, 217, 160],
      C_ATOM = [185, 216, 186], C_SERVO = [215, 122, 122], C_PHONE = [28, 39, 51],
      C_GAUGE = [170, 200, 225];

// ---- 部品定義 (座標は設計どおり: x=左右, y=高さ, z=前後。チルト部品は軸原点) ----
function shapesBottomPlate() {
  const s = [];
  cylInto(s, 0, 2, 0, 53, 4, C_DARK);                       // Ø106 x 4
  boxInto(s, 0, 4.75, -19.1, 79.4, 1.5, 28, C_DARK);        // スタック用トレー
  boxInto(s, 40.15, 5.75, -19.1, 2.5, 3.5, 24, C_DARK);     // トレーの端リップ
  boxInto(s, -5.5, 5, 0, 39, 2, 16, C_DARK);                // サドル土台
  boxInto(s, -20.6, 15.6, 0, 6.6, 19.25, 13, C_DARK);       // サドル左壁
  boxInto(s, 9.5, 15.6, 0, 6.2, 19.25, 13, C_DARK);         // サドル右壁
  return s;
}
function shapesStack() {
  const s = [];
  boxInto(s, 0, 14.35, -19.1, 75.4, 20.7, 24, C_STACK);     // Motion Base v1.2
  boxInto(s, -25.7, 29.45, -19.1, 24, 9.5, 24, C_ATOM);     // ATOM Lite
  return s;
}
function shapesPanServo() {
  const s = [];
  boxInto(s, -5.5, 20.75, 0, 22.5, 22.5, 12.2, C_SERVO);    // ボディ (底 z=9.5, サドルに吊る)
  boxInto(s, -5.5, 26.25, 0, 32.2, 2, 12.2, C_SERVO);       // フランジ
  cylInto(s, 0, 33.5, 0, 5.8, 5, C_SERVO);                  // ボス Ø11.6
  cylInto(s, 0, 37, 0, 2.4, 4, C_DARK);                     // シャフト Ø4.8
  return s;
}
function shapesShell() {
  const s = [];
  cylInto(s, 0, 22, 0, 52, 36, C_BASE);                     // Ø104 x H40 (半透明で描く)
  return s;
}
function shapesDeck() {
  const s = [];
  cylInto(s, 0, 35, 0, 15, 10, C_DARK);                     // 裏ハブ
  cylInto(s, 0, 44, 0, 52, 8, C_BASE);                      // デッキ Ø104 x 8
  return s;
}
function shapesCheek(sign) {
  const s = [];
  boxInto(s, sign * 39, 88, -9, 8, 80, 32, C_BASE);         // 板 (軸高さ116まで)
  cylXInto(s, sign * 39, 116, -13, 12, 8, C_BASE);          // ボス R12
  boxInto(s, sign * 39, 50, -9, 16, 4, 32, C_BASE);         // フット
  return s;
}
function shapesBackBox() {
  const s = [];
  boxInto(s, 0, 5, -1.25, 66, 120, 15.5, C_DARK);           // 本体 (チルト軸原点)
  boxInto(s, 0, 5, -9.9, 66, 120, 1.75, C_DARK);            // 背板
  boxInto(s, -33.25, 5, 12.9, 3.5, 120, 12.75, C_DARK);     // 保持アーム L
  boxInto(s, 33.25, 5, 12.9, 3.5, 120, 12.75, C_DARK);      // 保持アーム R
  boxInto(s, 0, -54.5, 12.9, 66, 5, 12.75, C_DARK);         // 下レール (上面がスマホ下端)
  return s;
}
function shapesTiltServo() {
  const s = [];
  boxInto(s, 14.75, -5.5, 0, 22.5, 22.5, 12.2, C_SERVO);    // ボディ (背面ボックス内)
  boxInto(s, 20.25, -5.5, 0, 2, 32.2, 12.2, C_SERVO);       // フランジ
  cylXInto(s, 27.5, 0, 0, 5.8, 5, C_SERVO);                 // ボス
  cylXInto(s, 31, 0, 0, 2.4, 4, C_DARK);                    // シャフト
  return s;
}
function shapesPhone() {
  const s = [];
  boxInto(s, 0, 17, 13, 63, 138, 9.5, C_PHONE);             // Rakuten Hand (下端から52mmを掴む)
  return s;
}
function shapesGauge() {
  const s = [];
  boxInto(s, 0, 3, 0, 104, 6, 34, C_GAUGE);                 // フィットゲージ板
  for (const dx of [-34, 0, 34]) boxInto(s, dx, 6.3, 0, 22.6, 0.6, 12.2, C_DARK); // ポケット (概念表示)
  return s;
}

// group: base=静止 / pan=パン回転 / tilt=チルト回転。asmStep: 組み立てステップ (1..6)、asmFrom: 退避方向
const PARTS = [
  { id: "plate", name: "底板", kind: "印刷", group: "base", asmStep: 1, asmFrom: [0, -30, 0], shapes: shapesBottomPlate(),
    spec: "Ø106×4 + スタック用トレー + パンサーボのサドル（フランジ吊り・長穴つき）", fix: "シェルへ M3×4" },
  { id: "stack", name: "ATOMスタック", kind: "購入", group: "base", asmStep: 1, asmFrom: [0, 0, -110], shapes: shapesStack(),
    spec: "ATOM Lite + ATOMIC Motion Base v1.2（実寸 75.4×24）", fix: "トレー + 端リップ + 両面テープ" },
  { id: "panservo", name: "パンサーボ SG90", kind: "購入", group: "base", asmStep: 1, asmFrom: [0, 80, 0], shapes: shapesPanServo(),
    spec: "ボディ 22.5×12.2×22.5 / フランジ 32.2 / 軸ずれ +5.5", fix: "フランジをサドルに M2（長穴で個体差を吸収）" },
  { id: "shell", name: "土台シェル", kind: "印刷", group: "base", asmStep: 2, asmFrom: [0, 140, 0], alpha: 0.35, shapes: shapesShell(),
    spec: "Ø104×H40、壁2、天面に Ø34 の穴、背面にケーブル用スロット", fix: "底板へ M3×4" },
  { id: "deck", name: "パンデッキ", kind: "印刷", group: "pan", asmStep: 3, asmFrom: [0, 120, 0], shapes: shapesDeck(),
    spec: "Ø104×8 + 裏ハブ Ø30", fix: "サーボホーンと M2 共締め" },
  { id: "cheekL", name: "頬板（左）", kind: "印刷", group: "pan", asmStep: 4, asmFrom: [-110, 0, 0], shapes: shapesCheek(-1),
    spec: "厚8×奥行32 + R12ボス、608ベアリング圧入", fix: "デッキへ M3 タッピング" },
  { id: "cheekR", name: "頬板（右）", kind: "印刷", group: "pan", asmStep: 4, asmFrom: [110, 0, 0], shapes: shapesCheek(1),
    spec: "厚8×奥行32 + R12ボス、ホーン下穴 Ø1.8×4", fix: "デッキへ M3 タッピング / ホーンを M2" },
  { id: "backbox", name: "背面ボックス＋ホルダ", kind: "印刷", group: "tilt", asmStep: 5, asmFrom: [0, 60, 90], shapes: shapesBackBox(),
    spec: "66×120×15.5 + 背板 + 保持アーム + 下レール", fix: "軸：右=サーボ軸、左=M8ボルト+608" },
  { id: "tiltservo", name: "チルトサーボ MG90S", kind: "購入", group: "tilt", asmStep: 5, asmFrom: [100, 0, 0], shapes: shapesTiltServo(),
    spec: "背面ボックスに内蔵、保持トルク 2.2 kg·cm", fix: "ポケットに差し込み + 耳ネジ M2" },
  { id: "phone", name: "Rakuten Hand (P710)", kind: "購入", group: "tilt", asmStep: 6, asmFrom: [0, 110, 0], shapes: shapesPhone(),
    spec: "63×138×9.5 / 134g、下端から52mmを掴む", fix: "アーム + 下レールで抱え込み" },
  { id: "gauge", name: "フィットゲージ（試作）", kind: "印刷", group: "none", asmStep: 99, asmFrom: [0, 0, 0], shapes: shapesGauge(),
    spec: "104×34×6、サーボポケット +0.2/+0.4/+0.6 の当たり確認用", fix: "—" },
];
const partById = (id) => PARTS.find(p => p.id === id);

const ASM_STEPS = [
  "ステップ 1：底板に ATOMスタックとパンサーボを固定（スタック=トレー+両面テープ、パンサーボ=フランジ吊りサドルに M2）",
  "ステップ 2：土台シェルを被せ、底板と M3×4 で締める",
  "ステップ 3：パンデッキをパンサーボのホーンに取り付け（M2 共締め、正面=90°で仮固定）",
  "ステップ 4：頬板をデッキに立てる（M3 タッピング、デッキ側は下穴 Ø2.6）",
  "ステップ 5：背面ボックスにチルトサーボを入れて、軸を両頬板に通す（耳ネジ M2 / 左は 608+M8ボルト）",
  "ステップ 6：スマホをホルダに載せて完成（アーム+下レールで抱え込み）",
];

// ---- 状態とモード ----
const AXIS_H = 116, DECK_TOP = 48, GRIP = 52;
const PHONE_M = 0.134, HOLDER_M = 0.064, CG_ALONG = 17, CG_PERP = 8;
let mode = "asm";
let panA = 0, tiltA = 0, panT = 0, tiltT = 0;
let gesture = null, gestureT0 = 0, sway = true, lastCmd = performance.now();
let asmT = 0, asmTarget = 0, asmPlaying = false;
let az = -0.65, el = 0.42, zoom = 2.1;
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");

function groupTf(p, part, off) {
  let q = [p[0] + off[0], p[1] + off[1], p[2] + off[2]];
  if (part.group === "base") return q;
  if (part.group === "pan") return rotY(q, -panA * Math.PI / 180);
  q = rotX(q, tiltA * Math.PI / 180);
  q = [q[0], q[1] + AXIS_H, q[2] - 13];
  return rotY(q, -panA * Math.PI / 180);
}
const ease = (t) => t * t * (3 - 2 * t);
function partProgress(part) {
  if (mode === "motion") return 1;
  return ease(Math.max(0, Math.min(1, asmT - (part.asmStep - 1))));
}
function buildItems() {
  const items = [];
  for (const part of PARTS) {
    if (part.group === "none") continue;
    const e = partProgress(part);
    const off = part.asmFrom.map(v => v * (1 - e));
    const alpha = (part.alpha == null ? 1 : part.alpha) * (mode === "asm" && e < 1 ? 0.12 + 0.88 * e : 1);
    for (const sh of part.shapes) {
      items.push({ color: sh.color, alpha, faces: sh.faces.map(f => f.map(p => groupTf(p, part, off))) });
    }
  }
  return items;
}

function drawMain() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const view = { az, el, zoom, cx: w / 2, cy: h * 0.58 };
  const proj = renderScene(ctx, w, h, buildItems(), (p) => p, view, true);
  // スマホの顔
  const phone = partById("phone");
  if (partProgress(phone) > 0.9) {
    const fp = (x, y) => proj(groupTf([x, 17 + y, 13 + 9.5 / 2 + 0.3], phone, [0, 0, 0]));
    const ex = fp(4.5, 30), ex0 = fp(0, 30);
    const eyeR = Math.max(1.5, Math.abs(ex[0] - ex0[0]));
    ctx.fillStyle = "#f5f5f5";
    for (const sx of [-11, 11]) {
      const e2 = fp(sx, 30);
      ctx.beginPath(); ctx.ellipse(e2[0], e2[1], eyeR, eyeR * 1.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    const m0 = fp(-8, 8), m1 = fp(0, 4.5), m2 = fp(8, 8);
    ctx.strokeStyle = "#f5f5f5"; ctx.lineWidth = Math.max(1.5, eyeR * 0.45); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(m0[0], m0[1]); ctx.quadraticCurveTo(m1[0], m1[1], m2[0], m2[1]); ctx.stroke();
  }
}

// ---- パーツ一覧 ----
let minisDone = false;
function renderMinis() {
  if (minisDone) return; minisDone = true;
  const grid = $("partsGrid");
  for (const part of PARTS) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>${part.name}<span class="tag ${part.kind === "購入" ? "buy" : ""}">${part.kind}</span></h3>` +
      `<canvas width="480" height="300"></canvas>` +
      `<div class="spec">${part.spec}<br>固定：${part.fix}</div>`;
    grid.appendChild(card);
    const c2 = card.querySelector("canvas");
    const x2 = c2.getContext("2d");
    let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
    for (const sh of part.shapes) for (const f of sh.faces) for (const p of f) {
      for (let i = 0; i < 3; i++) { mn[i] = Math.min(mn[i], p[i]); mx[i] = Math.max(mx[i], p[i]); }
    }
    const c = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
    const r = Math.max(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]) / 2 || 10;
    const items = part.shapes.map(sh => ({ color: sh.color, alpha: part.alpha == null ? 1 : Math.max(part.alpha, 0.75), faces: sh.faces }));
    renderScene(x2, 480, 300, items, (p) => [p[0] - c[0], p[1] - c[1], p[2] - c[2]],
      { az: -0.65, el: 0.42, zoom: 130 / r, cx: 240, cy: 150 }, false);
  }
  const note = document.createElement("div");
  note.className = "card";
  note.innerHTML = `<h3>その他</h3><div class="spec">608ベアリング（左軸）/ M2・M3ネジ / PTFE摺動パッド / ゴム足 / USB-Cケーブル×2<br>買い物：Motion Base v1.2 ¥1,606 + SG90 + MG90S（未注文）</div>`;
  grid.appendChild(note);
}

// ---- タブ ----
function setMode(m) {
  mode = m;
  $("tabParts").classList.toggle("on", m === "parts");
  $("tabAsm").classList.toggle("on", m === "asm");
  $("tabMotion").classList.toggle("on", m === "motion");
  $("partsGrid").style.display = m === "parts" ? "grid" : "none";
  $("stage").style.display = m === "parts" ? "none" : "flex";
  $("asmPanel").style.display = m === "asm" ? "block" : "none";
  $("motionPanel").style.display = m === "motion" ? "block" : "none";
  if (m === "parts") requestAnimationFrame(renderMinis);
  if (m === "asm") { panT = 0; tiltT = 0; gesture = null; }
}
$("tabParts").addEventListener("click", () => setMode("parts"));
$("tabAsm").addEventListener("click", () => setMode("asm"));
$("tabMotion").addEventListener("click", () => setMode("motion"));

// ---- 組み立てコントロール ----
$("asmRange").addEventListener("input", (e) => { asmT = asmTarget = +e.target.value; asmPlaying = false; $("asmPlay").textContent = "▶ 自動再生"; });
$("asmNext").addEventListener("click", () => { asmTarget = Math.min(6, Math.floor(asmTarget) + 1); });
$("asmPrev").addEventListener("click", () => { asmTarget = Math.max(0, Math.ceil(asmTarget) - 1); });
$("asmPlay").addEventListener("click", () => {
  if (asmTarget >= 6 && !asmPlaying) { asmT = asmTarget = 0; }
  asmPlaying = !asmPlaying;
  $("asmPlay").textContent = asmPlaying ? "⏸ 停止" : "▶ 自動再生";
});

// ---- 動作コントロール (ファームと同じ「少しずつ寄せる」) ----
$("pan").addEventListener("input", (e) => { panT = +e.target.value; lastCmd = performance.now(); gesture = null; });
$("tilt").addEventListener("input", (e) => { tiltT = +e.target.value; lastCmd = performance.now(); gesture = null; });
$("btnCenter").addEventListener("click", () => { panT = 0; tiltT = 0; gesture = null; syncSliders(); });
$("btnNod").addEventListener("click", () => { gesture = "nod"; gestureT0 = performance.now(); });
$("btnShake").addEventListener("click", () => { gesture = "shake"; gestureT0 = performance.now(); });
$("btnSway").addEventListener("click", () => { sway = !sway; });
function syncSliders() { $("pan").value = panT; $("tilt").value = tiltT; }

// ---- 視点操作 ----
let dragging = null;
cv.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  az += (e.clientX - dragging[0]) * 0.008;
  el = Math.max(-0.1, Math.min(1.3, el + (e.clientY - dragging[1]) * 0.006));
  dragging = [e.clientX, e.clientY];
});
cv.addEventListener("pointerup", () => { dragging = null; });
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom = Math.max(0.9, Math.min(5, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
}, { passive: false });

function stepToward(now, target, step) {
  if (now < target) return Math.min(target, now + step);
  if (now > target) return Math.max(target, now - step);
  return now;
}
const readout = $("readout");
let lastFrame = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  if (mode === "asm") {
    if (asmPlaying) {
      asmTarget = Math.min(6, asmTarget + dt * 0.7);
      if (asmTarget >= 6) { asmPlaying = false; $("asmPlay").textContent = "▶ 自動再生"; }
    }
    asmT = stepToward(asmT, asmTarget, dt * 1.8);
    $("asmRange").value = asmT;
    const st = Math.max(1, Math.min(6, Math.ceil(asmT)));
    $("asmVal").textContent = `ステップ ${st} / 6`;
    $("stepCap").innerHTML = ASM_STEPS[st - 1] + (asmT >= 5.99 ? "<br><b>完成！</b>「動作」タブで首を動かせます。" : "");
  }
  if (mode === "motion") {
    if (gesture === "nod") {
      const seq = [25, 0, 25, 0];
      const idx = Math.floor((now - gestureT0) / 260);
      if (idx >= seq.length * 2) { gesture = null; tiltT = 0; } else tiltT = seq[idx % seq.length];
    } else if (gesture === "shake") {
      const seq = [-25, 25, -25, 0];
      const idx = Math.floor((now - gestureT0) / 260);
      if (idx >= seq.length * 2) { gesture = null; panT = 0; } else panT = seq[idx % seq.length];
    } else if (sway && now - lastCmd > 8000 && Math.random() < 0.01) {
      panT = Math.round(Math.random() * 50 - 25);
      tiltT = Math.round(Math.random() * 14 - 4);
      syncSliders();
    }
  }
  panA = stepToward(panA, panT, 2);
  tiltA = stepToward(tiltA, tiltT, 1);
  if (mode !== "parts") drawMain();
  if (mode === "motion") {
    const tRad = Math.abs(tiltA) * Math.PI / 180;
    const torque = (PHONE_M + HOLDER_M) * (CG_ALONG / 10 * Math.sin(tRad) + CG_PERP / 10 * Math.cos(tRad));
    let minY = Infinity;
    for (const dz of [13 - 9.5 / 2, 13 + 9.5 / 2]) {
      minY = Math.min(minY, AXIS_H - GRIP * Math.cos(tRad) - dz * Math.sin(tRad));
    }
    const clearance = minY - DECK_TOP;
    $("panVal").textContent = `${Math.round(panA)}°`;
    $("tiltVal").textContent = `${Math.round(tiltA)}°`;
    readout.innerHTML =
      `チルト保持トルク: <b>${torque.toFixed(2)} kg·cm</b>（MG90S 2.2 に対して余裕 ${(2.2 / Math.max(torque, 0.01)).toFixed(1)} 倍）<br>` +
      `スマホ下端とデッキの隙間: <b class="${clearance > 0 ? "ok" : "warn"}">${clearance.toFixed(1)} mm</b><br>` +
      `パン端まで: あと ${Math.max(0, 85 - Math.abs(panA)).toFixed(0)}°（85°で機械ストッパ）`;
  }
}
setMode("asm");
animate();
</script>
</body>
</html>
